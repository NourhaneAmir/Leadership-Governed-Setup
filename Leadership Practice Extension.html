<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andalusia Pulse · Role workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --gold-dark:#A5845B;--gold-light:#F0C893;--brand-gold:#A5845B;--brand-gold-600:#2B160A;
 --green-dark:#49604C;--brand-green:#49604C;--brand-green-700:#2E372D;
 --ink:#211C1E;--neutral-400:#D9D9D9;--neutral-300:#EDEDED;--neutral-200:#F7F7F7;
 --canvas:#F7F4EE;--surface:#FFFFFF;--surface-hover:#FBF8F2;--border:#E8E0D3;--border-hover:#D8CBB4;
 --text-primary:#211C1E;--text-body:#514A44;--muted:#8A8079;--dim:#B3A99E;
 --warning:#C98A1E;--danger:#B23A3A;--info:#6B7B6E;
 --gold-soft:rgba(165,132,91,.12);--green-soft:rgba(73,96,76,.12);--danger-soft:rgba(178,58,58,.10);
 --warn-soft:rgba(201,138,30,.12);--sage-soft:rgba(107,123,110,.14);--gold-glow:rgba(165,132,91,.22);
 --grad-gold:linear-gradient(135deg,#A5845B 0%,#F0C893 100%);
 --grad-nav:linear-gradient(135deg,#2B160A 0%,#211C1E 100%);
 --sans:'Outfit',-apple-system,sans-serif;--body:'Inter',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace;
 --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;--r-pill:999px;
 --shadow-sm:0 1px 3px rgba(33,28,30,.06);--shadow-lg:0 12px 32px rgba(33,28,30,.12);
 --ease:cubic-bezier(0.22,1,0.36,1);
 --pbi:#B8930A;--pbi-soft:rgba(242,200,17,.18);
 --strat:#7A5AA8;--strat-soft:rgba(122,90,168,.13);
 --pm:#3C5A99;--pm-soft:rgba(60,90,153,.11);
 --unstruct:#9C5A2E;--unstruct-soft:rgba(156,90,46,.11);
 --proc:#2F6F7E;--proc-soft:rgba(47,111,126,.11);
 /* the four diagnostic types get their own quiet key */
 --d1:#5B7C8D;--d2:#8E5B2A;--d3:#6B5A9E;--d4:#4A7C59;
 --d1-soft:rgba(91,124,141,.13);--d2-soft:rgba(142,91,42,.12);
 --d3-soft:rgba(107,90,158,.12);--d4-soft:rgba(74,124,89,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--text-primary);font-family:var(--body);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
textarea,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--gold-dark);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.icon{width:13px;height:13px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-lg{width:16px;height:16px}.icon-sm{width:11px;height:11px}
.mono{font-family:var(--mono)}

.navbar{height:48px;background:var(--grad-nav);display:flex;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:50}
.nb-mark{width:30px;height:30px;border-radius:var(--r-sm);background:var(--grad-gold);display:flex;align-items:center;justify-content:center;color:var(--brand-gold-600)}
.nb-title{font-family:var(--sans);font-size:13px;font-weight:500;color:rgba(255,255,255,.55)}
.nb-title b{font-weight:700;color:#fff}
.nb-right{margin-left:auto;display:flex;align-items:center;gap:11px}
.nb-role{display:flex;align-items:center;gap:6px;background:var(--gold-soft);border:1px solid rgba(165,132,91,.45);border-radius:var(--r-pill);
 padding:3px 11px;color:var(--gold-light);font-family:var(--sans);font-size:11px;font-weight:600}
.nb-user{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:var(--r-pill);padding:3px 4px 3px 11px}
.nb-user .n{font-family:var(--sans);font-size:11px;font-weight:600;color:rgba(255,255,255,.85)}
.nb-av{width:24px;height:24px;border-radius:50%;background:var(--grad-gold);color:var(--brand-gold-600);display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:9px;font-weight:800}
.shell{display:grid;grid-template-columns:214px 1fr;min-height:calc(100vh - 48px)}
.sidebar{background:var(--grad-nav);padding:12px 0}
.sb-sec{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.26);padding:14px 14px 5px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border-left:3px solid transparent;color:rgba(255,255,255,.5);
 font-family:var(--sans);font-size:12.5px;font-weight:500;text-align:left}
.sb-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.82)}
.sb-item.active{background:var(--gold-soft);border-left-color:var(--brand-gold);color:var(--gold-light);font-weight:600}
.nb-badge{margin-left:auto;background:var(--gold-soft);color:var(--gold-light);border-radius:var(--r-pill);font-family:var(--mono);font-size:9px;font-weight:600;padding:1px 6px}
.nb-badge.red{background:var(--danger-soft);color:#E39A9A}

.page-head{background:linear-gradient(180deg,#fff,var(--canvas));border-bottom:1px solid var(--border);padding:14px 20px 0}
.crumb{font-size:11px;color:var(--muted);margin-bottom:4px}
.crumb b{color:var(--gold-dark);font-weight:600}
.title-row{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
h1{font-family:var(--sans);font-size:22px;font-weight:700;line-height:1.2}
.subtitle{font-size:12px;color:var(--text-body);margin-top:2px;max-width:860px}
.head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.rail{display:flex;gap:2px;align-items:flex-end;flex-wrap:wrap}
.rtab{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--muted);padding:8px 13px;border-bottom:2px solid transparent;display:flex;gap:7px;align-items:center}
.rtab.active{color:var(--brand-green);border-bottom-color:var(--brand-green)}
.rtab .ct{font-family:var(--mono);font-size:10px;background:var(--green-soft);color:var(--brand-green);border-radius:var(--r-pill);padding:1px 6px}
.rtab .ct.red{background:var(--danger-soft);color:var(--danger)}
.rtab .ct.amber{background:var(--warn-soft);color:var(--warning)}
.content{padding:16px 20px 50px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.card.flush{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ch .icon{color:var(--brand-gold)}.ch-t{font-family:var(--sans);font-size:14px;font-weight:600}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cnote{padding:13px 15px;font-size:11px;color:var(--text-body);border-top:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);font-size:12px;font-weight:600;border-radius:var(--r-md);
 padding:8px 14px;transition:background .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease);white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--gold-dark);color:#fff}.btn-primary:hover{background:#8E7049}
.btn-go{background:var(--green-dark);color:#fff}.btn-go:hover{background:var(--brand-green-700)}
.btn-outline{background:var(--surface);color:var(--text-body);border:1px solid var(--border)}
.btn-outline:hover{background:var(--surface-hover);border-color:var(--border-hover);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--muted)}.btn-ghost:hover{background:var(--surface-hover);color:var(--ink)}
.btn-pbi{background:var(--pbi-soft);color:#7A6000;border:1px solid rgba(242,200,17,.55)}
.btn-pm{background:var(--pm-soft);color:var(--pm);border:1px solid rgba(60,90,153,.3)}
.btn-strat{background:var(--strat-soft);color:var(--strat);border:1px solid rgba(122,90,168,.3)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:var(--r-sm);gap:5px}
.btn[disabled],.btn.blocked{opacity:.5;cursor:not-allowed;background:var(--neutral-200);color:var(--muted);border-color:var(--border)}
.b{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:2px 9px;font-family:var(--sans);font-size:10px;
 font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.bdot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.b-draft{background:var(--surface-hover);color:var(--muted)}
.b-sub{background:var(--warn-soft);color:var(--warning)}
.b-rev{background:var(--gold-soft);color:var(--gold-dark)}
.b-rmi{background:var(--danger-soft);color:var(--danger)}
.b-app{background:var(--green-soft);color:var(--green-dark)}
.b-pbi{background:var(--pbi-soft);color:#7A6000}
.b-pm{background:var(--pm-soft);color:var(--pm)}
.b-strat{background:var(--strat-soft);color:var(--strat)}
.b-un{background:var(--unstruct-soft);color:var(--unstruct)}
.b-proc{background:var(--proc-soft);color:var(--proc)}
.acts{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}
thead th{background:var(--gold-dark);color:#fff;text-align:left;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.7px;
 text-transform:uppercase;padding:9px 14px;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:nth-child(even){background:var(--neutral-200)}
tbody td{padding:10px 14px;font-size:12px;vertical-align:top}
.t-name{font-family:var(--sans);font-size:12px;font-weight:600}
.t-sub{font-size:10px;color:var(--muted);margin-top:2px}

/* ===== diagnostic key — four types, always the same colours ===== */
.dg{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-sm);padding:2px 8px;font-family:var(--sans);
 font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.dg.d1{background:var(--d1-soft);color:var(--d1)}
.dg.d2{background:var(--d2-soft);color:var(--d2)}
.dg.d3{background:var(--d3-soft);color:var(--d3)}
.dg.d4{background:var(--d4-soft);color:var(--d4)}
.dg.none{background:var(--danger-soft);color:var(--danger)}
.dgbar{display:flex;gap:3px;align-items:center}
.dgbar i{width:16px;height:5px;border-radius:2px;background:var(--neutral-300);display:block}
.dgbar i.d1{background:var(--d1)}.dgbar i.d2{background:var(--d2)}
.dgbar i.d3{background:var(--d3)}.dgbar i.d4{background:var(--d4)}

/* ===== artifacts ===== */
.arts{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:14px;margin-bottom:16px}
.art{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);padding:14px;text-align:left;width:100%;
 position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.art::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--brand-gold)}
.art.report::before{background:var(--proc)}
.art.pack::before{background:var(--strat)}
.art.svc::before{background:var(--pm)}
.art:hover{border-color:var(--gold-dark);box-shadow:0 4px 14px rgba(33,28,30,.08)}
.art-k{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--dim);margin-top:4px}
.art-t{font-family:var(--sans);font-size:14.5px;font-weight:700;margin-top:4px;line-height:1.25}
.art-m{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px}
.art-f{display:flex;gap:8px;align-items:center;margin-top:11px;padding-top:10px;border-top:1px dashed var(--border);flex-wrap:wrap}
.prog{height:6px;border-radius:3px;background:var(--neutral-300);overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;background:var(--brand-green)}
.prog.warn i{background:var(--warning)}.prog.bad i{background:var(--danger)}

/* ===== composer ===== */
.cmp{display:grid;grid-template-columns:212px 1fr 330px;align-items:stretch}
.outline{border-right:1px solid var(--border);background:var(--neutral-200);padding:12px 0}
.ol-h{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);padding:4px 14px 8px}
.ol{display:flex;gap:9px;width:100%;text-align:left;padding:9px 14px;border-left:3px solid transparent;align-items:flex-start}
.ol:hover{background:var(--surface)}
.ol.on{background:var(--surface);border-left-color:var(--brand-gold)}
.ol-n{font-family:var(--mono);font-size:10px;color:var(--dim);padding-top:2px;min-width:13px}
.ol-t{font-family:var(--sans);font-size:11.5px;font-weight:600;line-height:1.3}
.ol-s{font-size:10px;color:var(--muted);margin-top:2px}
.editor{padding:16px 18px;min-width:0}
.ed-t{font-family:var(--sans);font-size:17px;font-weight:700}
.ed-s{font-size:11px;color:var(--muted);margin-top:2px}
.para{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);margin-bottom:11px;overflow:hidden}
.para.on{border-color:var(--gold-dark);box-shadow:0 0 0 3px var(--gold-glow)}
.p-h{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--neutral-200);border-bottom:1px solid var(--border);flex-wrap:wrap}
.p-t{font-family:var(--sans);font-size:12px;font-weight:700}
.p-b{padding:11px 12px}
.p-b textarea{width:100%;border:none;resize:vertical;font-size:12.5px;line-height:1.8;color:var(--text-body);min-height:66px;background:transparent}
.p-b textarea:focus{outline:none}
.p-f{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px dashed var(--border);flex-wrap:wrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:var(--r-pill);padding:1px 8px;
 font-family:var(--mono);font-size:9.5px;background:var(--surface);color:var(--text-body)}
.chip.pbi{border-color:rgba(242,200,17,.6);background:var(--pbi-soft);color:#7A6000}
.chip.pm{border-color:rgba(60,90,153,.35);background:var(--pm-soft);color:var(--pm)}
.chip.strat{border-color:rgba(122,90,168,.35);background:var(--strat-soft);color:var(--strat)}
.chip.concl{border-color:rgba(122,90,168,.4);background:rgba(122,90,168,.10);color:var(--strat)}
.b-concl{background:rgba(122,90,168,.13);color:var(--strat)}
.chip.un{border-color:rgba(156,90,46,.35);background:var(--unstruct-soft);color:var(--unstruct)}
.chip.none{border-color:rgba(178,58,58,.4);background:var(--danger-soft);color:var(--danger)}
.reuse{display:inline-flex;align-items:center;gap:5px;background:var(--gold-soft);color:var(--gold-dark);border-radius:var(--r-sm);
 padding:1px 7px;font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.side{border-left:1px solid var(--border);background:var(--neutral-200);display:flex;flex-direction:column;overflow:hidden}
.side-tabs{display:flex;gap:1px;padding:10px 11px 0;flex-wrap:wrap}
.stab{font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 9px;border-radius:7px 7px 0 0;border-bottom:2px solid transparent}
.stab.on{background:var(--surface);color:var(--gold-dark);border-bottom-color:var(--gold-dark)}
.side-b{padding:12px 11px 18px;overflow-y:auto;flex:1}
.side-h{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);
 display:flex;align-items:center;gap:7px;margin-bottom:8px}
.side-h .n{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.ref{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:9px 10px;margin-bottom:8px}
.ref.used{border-color:rgba(165,132,91,.5);background:#FDFAF5}
.ref-t{font-family:var(--sans);font-size:11.5px;font-weight:600;display:flex;gap:6px;align-items:flex-start}
.ref-m{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px}
.ref-a{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.scopebar{display:flex;gap:7px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);
 padding:8px 10px;margin-bottom:11px;flex-wrap:wrap}
.q{border-left:2px solid var(--unstruct);padding:3px 0 3px 9px;font-size:11px;color:var(--text-body);font-style:italic;margin-top:6px}

/* ===== power bi ===== */
.tree{border-right:1px solid var(--border);padding:11px 8px;background:var(--neutral-200)}
.tnode{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:7px 10px;border-radius:var(--r-sm)}
.tnode:hover{background:var(--surface)}
.tnode.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--pbi)}
.tnode .cap{font-family:var(--sans);font-size:11.5px;font-weight:600}
.tnode .sub{font-size:10px;color:var(--muted);margin-top:1px}
.tl2{padding-left:20px}.tl3{padding-left:36px}
.vis{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);overflow:hidden;margin-bottom:12px}
.vis.on{border-color:var(--pbi);box-shadow:0 0 0 3px rgba(242,200,17,.2)}
.vis-h{display:flex;gap:8px;align-items:center;padding:9px 11px;background:var(--neutral-200);border-bottom:1px solid var(--border);flex-wrap:wrap}
.spark{display:flex;align-items:flex-end;gap:4px;height:56px;margin-top:8px}
.spark i{flex:1;background:rgba(60,90,153,.35);border-radius:2px 2px 0 0;display:block}
.spark i.last{background:var(--pm)}
.cmtbox{border-top:1px dashed var(--border);background:#FDFBF6;padding:11px}
.pdraft{border:1px solid rgba(165,132,91,.4);border-left:3px solid var(--gold-dark);border-radius:var(--r-sm);background:#FDF8F0;padding:10px 11px;margin-top:8px}

/* ===== P&M entry ===== */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.flbl{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
.inp{display:flex;align-items:center;border:1px solid var(--neutral-400);border-radius:var(--r-sm);background:var(--surface)}
.inp:focus-within{border-color:var(--pm);box-shadow:0 0 0 3px rgba(60,90,153,.13)}
.inp input,.inp select{flex:1;min-width:0;border:none;background:transparent;padding:8px 10px;font-size:12.5px;color:var(--ink)}
.inp input:focus,.inp select:focus{outline:none}
.inp .suf{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding-right:10px}
.rta{width:100%;border:1px solid var(--neutral-400);border-radius:var(--r-sm);background:var(--surface);padding:9px 11px;
 font-size:12.5px;line-height:1.65;resize:vertical;min-height:62px;color:var(--ink)}
.rta:focus{outline:none;border-color:var(--gold-dark);box-shadow:0 0 0 3px var(--gold-glow)}
.derived{margin-top:13px;border:1px dashed var(--border-hover);border-radius:var(--r-md);background:var(--neutral-200);padding:12px 13px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-sm);padding:6px 11px;
 font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--text-body)}
.seg button.on{background:var(--pm-soft);border-color:var(--pm);color:var(--pm)}
.seg.d button.on{background:var(--gold-soft);border-color:var(--gold-dark);color:var(--gold-dark)}

/* ===== communications ===== */
.msg{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--border);align-items:flex-start}
.msg:last-child{border-bottom:none}
.msg.unread{background:#FDF8F0}
.msg-ic{width:28px;height:28px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.msg-ic.in{background:var(--gold-soft);color:var(--gold-dark)}
.msg-ic.out{background:var(--green-soft);color:var(--green-dark)}
.msg-ic.esc{background:var(--strat-soft);color:var(--strat)}
.msg-ic.sup{background:var(--unstruct-soft);color:var(--unstruct)}

 return '<div style="border:1px solid #1b2a3a;border-radius:8px;overflow:hidden;margin-top:8px;box-shadow:0 1px 4px rgba(20,31,46,.18)">'+
  '<div style="background:#141f2e;color:#e8ecf1;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px">'+
  '<div style="display:flex;align-items:center;gap:8px;min-width:0">'+
  '<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:#f2c811;border-radius:3px;color:#141f2e;font-size:10px;font-weight:800;flex:none">P</span>'+
  '<span style="font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(title)+'</span>'+
  '<span style="font-size:9px;color:#a7b1bf;border:1px solid #3a4657;border-radius:3px;padding:1px 6px;flex:none">EMBEDDED</span></div>'+
  '<a href="'+esc(link)+'" target="_blank" rel="noopener" style="font-size:10.5px;color:#f2c811;white-space:nowrap;flex:none">Open in Power BI \u2197</a></div>'+
  '<div style="background:#f3f2f1;padding:14px">'+inner+'</div>'+
  (tabs?'<div style="background:#faf9f8;border-top:1px solid #e1dfdd;padding:6px 12px;display:flex;gap:6px">'+
   tabs.map(function(t,i){return '<span style="font-size:10px;padding:3px 9px;border-radius:4px 4px 0 0;'+
    (i===0?'background:#fff;color:#252423;font-weight:600;border:1px solid #e1dfdd;border-bottom:none':'color:#605e5c')+'">'+esc(t)+'</span>';}).join("")+'</div>':"")+
  '</div>';}
function biTile(title,badge,value,bars){
 return '<div style="background:#fff;border:1px solid #e1dfdd;border-radius:4px;padding:12px;flex:1;min-width:180px">'+
  '<div style="font-size:11px;font-weight:600;color:#252423;margin-bottom:2px">'+esc(title)+'</div>'+
  (badge?'<div style="font-size:9.5px;color:#605e5c;margin-bottom:8px">'+esc(badge)+'</div>':'<div style="margin-bottom:8px"></div>')+
  '<div class="mono" style="font-size:19px;font-weight:700;color:#252423">'+value+'</div>'+
  (bars?'<div class="spark" style="height:38px;margin-top:8px">'+bars.map(function(x,i){return '<i class="'+(i===bars.length-1?"last":"")+'" style="height:'+x+'%"></i>';}).join("")+'</div>':'')+
  '</div>';}

/* a realistic-looking sample dashboard — stands in for the real Power BI
   embed until a real report ID/token is wired up. */
function sampleDashboard(kObj,scope){
 var rec=scope?achFor(kObj,scope.bu,scope.month,scope.year):null;
 var pct=achPct(rec);
 var bars=[58,64,60,71,66,75,70,rec?Math.max(20,Math.min(96,rec.actual)):80];
 var varBars=[70,64,58,66,52,60,55,rec&&pct!=null?Math.max(15,Math.min(96,pct)):62];
 var inner='<div style="display:flex;gap:12px;flex-wrap:wrap">'+
  biTile(kObj.n,rec?"Target "+rec.target+kObj.unit:"No target set",rec?rec.actual+kObj.unit:"\u2014",bars)+
  biTile("Achievement vs. target","Same period",pct!=null?pct+"%":"\u2014",varBars)+
  '</div>';
 return biChrome(kObj.n+" \u2014 preview",biReport(kObj.biReportId||"").link||"#",inner,["Overview","Trend","Detail"]);}

/* the BI dashboard behind a KPI — toggled open inline, not a navigate-away link */
function biEmbedStrip(biId,kObj,scope){
 var b=biReport(biId);if(!b)return"";
 var open=!!OPENBI[biId];
 return '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)">'+
  '<button class="btn btn-outline btn-sm" data-act="togglebi|'+biId+'">'+ico(open?"up":"chart","icon-sm")+' '+
  (open?"Close dashboard":'Open \u201c'+esc(b.n)+'\u201d inside this report')+'</button>'+
  (open?sampleDashboard(kObj,scope||DEFAULT_SCOPE):"")+
  '</div>';}
function citeCard(id,scope){
 var kf=findKpiOrBd(id);
 if(kf){
  var rec=scope?achFor(kf.bd||kf.k,scope.bu,scope.month,scope.year):null;
  var pct=achPct(rec);
  return '<div class="pdraft" style="margin:6px 0 0"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
   '<span class="chip pbi">'+ico("chart","icon-sm")+(kf.bd?kf.k.n+" — "+kf.bd.dim+": "+kf.bd.n:kf.k.n)+'</span>'+
   (rec?('<span class="mono" style="font-size:11.5px">Target <b>'+rec.target+kf.k.unit+'</b> · Actual <b>'+rec.actual+kf.k.unit+'</b></span>'+
    '<span class="b '+achCls(pct)+'"><span class="bdot"></span>'+(pct!=null?pct+"% achievement":"—")+'</span>'):
    '<span class="t-sub" style="margin:0">No achievement recorded for '+(scope?scope.bu+" · "+MONN[scope.month-1]+" "+scope.year:"this period")+'.</span>')+
   '</div>'+(kf.k.biReportId?biEmbedStrip(kf.k.biReportId,kf.k,scope):'')+'</div>';}
 var orep=orgRep(id);
 if(orep)return '<div class="pdraft" style="margin:6px 0 0">'+
   '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px">'+
   '<span class="chip">Child report/plan</span><b style="font-size:12.5px">'+esc(orep.n)+'</b>'+
   '<span class="b b-app"><span class="bdot"></span>'+esc(orep.st)+'</span></div>'+
   '<div class="ed-s" style="margin-bottom:6px">'+esc(orep.au)+' · '+esc(orep.when)+' · '+orep.paras.length+' paragraph'+(orep.paras.length===1?"":"s")+'</div>'+
   orep.paras.slice(0,2).map(function(p){return '<div style="font-size:12px;color:var(--muted);margin:2px 0">\u2022 '+esc(p.h)+'</div>';}).join("")+
   (orep.paras.length>2?'<div class="ed-s">+ '+(orep.paras.length-2)+' more</div>':"")+
   '<button class="btn btn-outline btn-sm" style="margin-top:6px" data-act="openrep|'+orep.id+'">'+ico("open")+'Open full report/plan</button></div>';
 var tk=task(id);
 if(tk)return '<div class="pdraft" style="margin:6px 0 0"><span class="chip">Task</span> <b>'+esc(tk.t)+'</b> — '+esc(tk.who)+' · due '+esc(tk.due)+' · '+esc(tk.st)+'</div>';
 var iss=issue(id);
 if(iss)return '<div class="pdraft" style="margin:6px 0 0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px">'+
   '<span class="chip un">'+esc(iss.sys)+'</span><b style="font-size:12.5px">'+esc(iss.n)+'</b>'+
   '<span class="b '+(iss.sev==="High"?"b-rmi":"b-sub")+'"><span class="bdot"></span>'+esc(iss.sev)+'</span></div>'+
   '<div class="ed-s">'+esc(iss.id)+' · '+esc(iss.st)+' · owner '+esc(iss.own)+' · opened '+esc(iss.when)+'</div></div>';
 var pm=pmById(id);
 if(pm)return '<div class="pdraft" style="margin:6px 0 0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px">'+
   '<span class="chip pm">'+esc(pm.k)+'</span><b style="font-size:12.5px">'+esc(pm.n)+'</b></div>'+
   '<div class="ed-s">'+pmLine(pm)+' · owner '+esc(pm.own||"\u2014")+' · classified under '+esc(pm.tac||"")+'</div></div>';
 var fv=findVis(id);
 if(fv)return '<div class="pdraft" style="margin:6px 0 0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
   '<span class="chip pbi">'+ico("chart","icon-sm")+esc(fv.v.n)+'</span>'+
   '<span class="mono" style="font-size:11.5px"><b>'+esc(fv.v.val)+'</b></span>'+dgChip(fv.v.diag)+'</div></div>';
 var op=orgPara(id);
 if(op)return '<div class="pdraft" style="margin:6px 0 0"><div class="ed-s" style="margin-bottom:4px">From '+esc(op.r.au)+' · '+esc(op.r.n)+'</div>'+
   '<div style="font-size:12.5px;line-height:1.7;font-style:italic;border-left:3px solid var(--gold-dark);padding-left:10px">\u201c'+esc(op.p.v)+'\u201d</div></div>';
 var mp=para(id);
 if(mp&&mp.v.trim())return '<div class="pdraft" style="margin:6px 0 0"><div class="ed-s" style="margin-bottom:4px">Your paragraph</div>'+
   '<div style="font-size:12.5px;line-height:1.7;font-style:italic;border-left:3px solid var(--gold-dark);padding-left:10px">\u201c'+esc(mp.v)+'\u201d</div></div>';
 var st=null;for(var i=0;i<STRAT.length;i++)if(STRAT[i].id===id)st=STRAT[i];
 if(st){
  var parName=st.par&&strat(st.par)?strat(st.par).n:null;
  var extra='';
  if(st.k==="Project"&&(st.budget||st.start||st.end||st.scope)){
   extra='<div class="ed-s">Project: owner '+esc(st.own||"—")+' · budget '+(st.budget?Number(st.budget).toLocaleString():"—")+
    ' · '+esc(st.start||"—")+' \u2192 '+esc(st.end||"—")+' · '+esc(st.scope||"—")+'</div>';
  } else {
   extra='<div class="ed-s">'+esc(st.st||"")+(st.own?' · owner '+esc(st.own):'')+(st.pct!=null?' · '+st.pct+'%':'')+'</div>';
  }
  return '<div class="pdraft" style="margin:6px 0 0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px">'+
   '<span class="chip strat">'+esc(st.k)+'</span><b style="font-size:12.5px">'+esc(st.n)+'</b>'+
   (parName?'<span class="chip">under '+esc(parName)+'</span>':'')+
   (st.proc?'<span class="chip">'+st.proc+'</span>':'')+'</div>'+extra+'</div>';}
 var at=attach(id);
 if(at)return '<div class="pdraft" style="margin:6px 0 0"><span class="chip">Attachment</span> <b>'+esc(at.n)+'</b> · '+esc(at.note||"")+'</div>';
 return '<div class="pdraft" style="margin:6px 0 0"><span class="chip none">'+esc(id)+' — nothing found for this id</span></div>';}

function scBuild(){
 var B=ensureBuild(),sc=B.scope;
 var h='<div class="card flush"><div class="ch">'+ico("pen","icon-lg")+
  '<span class="ch-t">Build a report/plan</span>'+
  '<span class="r"><span class="mono" style="font-size:10px;color:var(--muted)">add, remove, reorder — nothing is fixed</span></span></div>'+
  '<div style="padding:15px">'+
  '<div class="flbl" style="margin-bottom:8px">Scope — which KPIs this report/plan can reference</div>'+
  '<div class="fgrid" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:10px">'+
  '<div class="fld"><label class="flbl">Department</label><div class="inp"><select data-bf="scope:dept">'+
   DEPTS.map(function(d){return '<option value="'+d.id+'"'+(sc.dept===d.id?" selected":"")+'>'+d.n+'</option>';}).join("")+'</select></div></div>'+
  '<div class="fld"><label class="flbl">Function</label><div class="inp"><select data-bf="scope:fn">'+
   '<option value="">All</option>'+fnsOfDept(sc.dept).map(function(f){return '<option value="'+f.id+'"'+(sc.fn===f.id?" selected":"")+'>'+f.n+'</option>';}).join("")+
   '</select></div></div>'+
  '<div class="fld"><label class="flbl">Business Unit</label><div class="inp"><select data-bf="scope:bu">'+
   BUS.map(function(b){return '<option value="'+b.id+'"'+(sc.bu===b.id?" selected":"")+'>'+buName(b.id)+'</option>';}).join("")+'</select></div></div>'+
  '<div class="fld"><label class="flbl">Month</label><div class="inp"><select data-bf="scope:month">'+
   MONN.map(function(m,i){return '<option value="'+(i+1)+'"'+(sc.month===i+1?" selected":"")+'>'+m+'</option>';}).join("")+'</select></div></div>'+
  '<div class="fld"><label class="flbl">Year</label><div class="inp"><select data-bf="scope:year">'+
   [2025,2026,2027].map(function(y){return '<option value="'+y+'"'+(sc.year===y?" selected":"")+'>'+y+'</option>';}).join("")+'</select></div></div>'+
  '</div>'+
  '<div class="ed-s" style="margin-top:8px">Only KPIs (and POCs on them) in <b>'+deptName(sc.dept)+(sc.fn?" · "+fnName(sc.fn):"")+
  '</b> are offered below, with achievement shown for <b>'+buName(sc.bu)+' · '+MONN[sc.month-1]+' '+sc.year+'</b>.</div>'+
  '</div></div>';

 h+='<div class="card flush"><div style="padding:15px">'+
  '<div class="fgrid" style="grid-template-columns:2fr 1fr;gap:12px">'+
  '<div class="fld"><label class="flbl">Title</label><div class="inp"><input data-bf="title" value="'+esc(B.title)+
  '" placeholder="e.g. Theatre allocation — TOT alignment record"></div></div>'+
  '<div class="fld"><label class="flbl">Audience</label><div class="inp"><input data-bf="to" value="'+esc(B.to)+
  '" placeholder="Who receives this"></div></div></div>'+
  '<div class="fld" style="margin-top:10px"><label class="flbl">Also share with <span class="mono" style="font-size:10px;color:var(--muted)">optional \u2014 beyond the default audience</span></label>'+
  '<div class="inp"><input data-bf="shareWith" value="'+esc(B.shareWith||"")+'" placeholder="Names, comma separated \u2014 e.g. Dr. Hazem, Mona Adel"></div></div>'+

  '<div class="fld"><label class="flbl">Template <span class="mono" style="font-size:10px;color:var(--muted)">configured in Templates \u2192</span></label>'+
  '<div class="inp"><select data-bf="template"><option value="">Blank — no scaffold</option>'+
  TEMPLATES.map(function(t){return '<option value="'+t.id+'"'+(B.template===t.id?" selected":"")+'>'+t.n+'</option>';}).join("")+
  '</select></div></div>'+
  (B.template?'<button class="btn btn-outline btn-sm" data-act="buildscaffold|">'+ico("layers")+'Insert as starting rows</button>':"")+
  '</div>'+(B.template&&tpl(B.template)?'<div class="ed-s" style="margin-top:6px">'+esc(tpl(B.template).desc)+'</div>':"")+

 h+=B.blocks.map(function(b,i){return buildBlockHtml(b,i,B.blocks.length,sc);}).join("");

 h+='<div class="card" style="padding:14px;text-align:center">'+
  '<button class="btn btn-primary btn-sm" data-act="addblock|">'+ico("plus")+'Add unstructured paragraph / conclusion</button>'+

 h+='<div class="card flush"><div style="padding:14px" class="acts">'+

 return h;}

function buildBlockHtml(b,i,total,scope){
 var open=(BUILD.pickerOpen===b.id);
 return '<div class="vis on"><div class="vis-h">'+ico("doc")+
  '<input data-bf="h:'+b.id+'" value="'+esc(b.h||"")+'" placeholder="Heading (optional)" '+
  'style="border:none;background:transparent;font-weight:600;font-size:12.5px;flex:1;min-width:140px;color:var(--ink)">'+
  '<div class="seg d">'+["none","d1","d2","d3","d4"].map(function(x){
   return '<button class="'+((b.diag||"none")===x?"on":"")+'" data-act="blockdiag|'+b.id+':'+x+'">'+(x==="none"?"untyped":DIAG[x].n)+'</button>';}).join("")+'</div>'+
  '<span class="acts" style="margin-left:auto">'+
  (i>0?'<button class="btn btn-ghost btn-sm" data-act="mvblock|'+b.id+':up" title="Move up">'+ico("up")+'</button>':"")+
  (i<total-1?'<button class="btn btn-ghost btn-sm" data-act="mvblock|'+b.id+':down" title="Move down">'+ico("down")+'</button>':"")+
  '<button class="btn btn-ghost btn-sm" data-act="rmblock|'+b.id+'" title="Remove">\u2715</button>'+
  '</span></div>'+
  '<div style="padding:12px">'+
  '<textarea class="rta" data-bf="v:'+b.id+'" placeholder="Write it — the conclusion, the update, whatever this row is for. Cite what it rests on below.">'+esc(b.v||"")+'</textarea>'+
  (b.cites.length?b.cites.map(function(c){
   return '<div style="position:relative">'+citeCard(c,scope)+
    '<button class="btn btn-ghost btn-sm" data-act="blockuncite|'+b.id+':'+c+'" style="position:absolute;top:4px;right:4px;padding:1px 6px">\u00d7</button></div>';}).join(""):
   '<div class="chip none" style="margin-top:8px">no source yet — free text only</div>')+
  '<div class="p-f" style="border-top:1px dashed var(--border);margin-top:9px;padding:8px 0 0">'+
  '<button class="btn btn-outline btn-sm" data-act="blockpicker|'+b.id+'">'+ico("plus")+'Cite a KPI, breakdown, POC/project, task or paragraph</button>'+
  (b.tac&&strat(b.tac)?' <span class="reuse" title="This paragraph will count toward coverage for '+esc(strat(b.tac).n)+' once issued">'+ico("check","icon-sm")+' counts toward '+esc(strat(b.tac).n)+'\u2019s coverage</span>':'')+
  '</div>'+
  (open?buildPicker(b,scope):"")+
  (open&&BUILD.newFor&&BUILD.newFor.block===b.id?buildStratForm(b):"")+
  '</div></div>';}

function buildPicker(b,scope){
 var kinds=[['kpi','KPI'],['bd','KPI breakdown'],['poc','POC / Tactic'],['project','Project'],
   ['pm','P&M entry'],['task','Task'],['issue','Issue (other system)'],['vis','BI visual'],['para','Paragraph'],['report','Child report/plan']];
 var pk=BUILD.pickerKind;
 var h='<div class="cmtbox">'+

  '</div>'+

 return h;}

function pickList(items,actName,blockId){

  (items.length?items.map(function(c){
   return '<div class="item" style="display:flex;gap:8px;align-items:center;padding:7px 9px;margin:2px 0;border-radius:6px;background:#fff;cursor:pointer;border:1px solid var(--border)" data-act="'+actName+'|'+blockId+':'+c.id+'">'+
   '<span style="font-size:12.5px;flex:1">'+esc(c.label)+'</span>'+(c.sub?'<span class="mono" style="font-size:10px;color:var(--muted)">'+esc(c.sub)+'</span>':'')+
   '</div>';}).join(""):'<div class="ed-s" style="padding:8px">Nothing here yet.</div>')+
  '</div>';}

function buildPickerBody(b,pk,scope){
 var sel=BUILD.pickerSel=BUILD.pickerSel||{};
 var scopedKpis=KPIS.filter(function(k){return k.dept===scope.dept&&(!scope.fn||k.fn===scope.fn);});

 if(pk==="kpi"){
  var items=scopedKpis.map(function(k){var rec=achFor(k,scope.bu,scope.month,scope.year);
   return {id:k.id,label:k.n+" · "+k.type,sub:rec?"target "+rec.target+k.unit+", actual "+rec.actual+k.unit:"no data this period"};});
  return pickList(items,"blockcite",b.id);}

 if(pk==="bd"){
  var kpisWithBd=scopedKpis.filter(function(k){return (k.breakdowns||[]).length;});
  var h='<label class="flbl">Related KPI</label><select data-bf="pk:kpiId" style="width:100%;margin-bottom:8px">'+
   '<option value="">Choose a KPI\u2026</option>'+kpisWithBd.map(function(k){return '<option value="'+k.id+'"'+(sel.kpiId===k.id?" selected":"")+'>'+k.n+'</option>';}).join("")+
   '</select>';
  var K=sel.kpiId?kpi(sel.kpiId):null;
  if(K&&kpisWithBd.indexOf(K)<0)K=null;
  if(K){
   var dims=bdDims(K);
   h+='<label class="flbl" style="margin:6px 0 6px;display:block">Breakdown type</label><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+
    dims.map(function(d){return '<button class="btn btn-sm '+(sel.dim===d?"btn-primary":"btn-outline")+'" data-act="pkset|'+b.id+':dim:'+d+'">'+d+'</button>';}).join("")+'</div>';
   if(sel.dim){
    var items2=K.breakdowns.filter(function(bd){return bd.dim===sel.dim;}).map(function(bd){var rec=achFor(bd,scope.bu,scope.month,scope.year);
     return {id:bd.id,label:bd.n,sub:rec?"target "+rec.target+K.unit+", actual "+rec.actual+K.unit:"no data"};});
    h+=pickList(items2,"blockcite",b.id);
   }
  }
  return h;}

 if(pk==="poc"){
  var mode=sel.pocMode||"tactic";
  var h='<div style="display:flex;gap:6px;margin-bottom:8px">'+
   '<button class="btn btn-sm '+(mode==="tactic"?"btn-primary":"btn-outline")+'" data-act="pkset|'+b.id+':pocMode:tactic">By related Tactic (Strategy)</button>'+
   '<button class="btn btn-sm '+(mode==="kpi"?"btn-primary":"btn-outline")+'" data-act="pkset|'+b.id+':pocMode:kpi">By related KPI</button></div>';
  var tacticId=sel.pocTactic,pocs=[],tacticsList;
  if(mode==="tactic"){
   tacticsList=STRAT.filter(function(x){return x.k==="Tactic";});

 if(o)return '<span class="chip concl" title="someone else\u2019s conclusion">'+ico("doc","icon-sm")+id+'</span>';

  '</div>'+
  (open?cmtBox(pickV.id,pickV.diag,pickV.proc,"visual "+pickV.id):"")+'</div>';

 toast("Nothing in the system resolves to <b>"+esc(id)+"</b> yet.","al");}

   clicking pops up what's actually inside the report.

function hierRelated(rid){
 var set={};
 function upAll(id){if(set[id])return;set[id]=true;reportParentIds(id).forEach(upAll);}
 function downAll(id){if(set[id])return;set[id]=true;reportChildIds(id).forEach(downAll);}
 upAll(rid);downAll(rid);return set;}
function hierMatches(r){
 if(HIERFILTER.name&&r.n.toLowerCase().indexOf(HIERFILTER.name.toLowerCase())<0)return false;
 if(HIERFILTER.type&&r.type!==HIERFILTER.type)return false;
 if(HIERFILTER.dept&&(!r.scope||r.scope.dept!==HIERFILTER.dept))return false;
 return true;}
function hierNode(rid,visited){
 if(visited[rid])return "";
 var v2={};for(var k in visited)v2[k]=true;v2[rid]=true;
 var r=orgRep(rid);if(!r)return"";
 var children=reportChildIds(rid);
 var related=HIERFOCUS?hierRelated(HIERFOCUS):null;
 var filtersActive=!!(HIERFILTER.name||HIERFILTER.type||HIERFILTER.dept);
 var faded=(related&&!related[rid])||(filtersActive&&!hierMatches(r));
 var box='<div class="tnodebox'+(faded?" dim":"")+(HIERFOCUS===rid?" focused":"")+'" data-act="hierclick|'+rid+'">'+
  '<div class="tn-t">'+esc(r.n)+'</div>'+
  '<div class="tn-m">'+esc(r.type||"Report/Plan")+' \u00b7 '+esc(r.au)+'</div>'+
  '<div class="tn-m">'+r.paras.length+' section'+(r.paras.length===1?"":"s")+
  (children.length?' \u00b7 '+children.length+' child'+(children.length===1?"":"ren"):"")+'</div></div>';
 if(!children.length)return '<li>'+box+'</li>';
 return '<li>'+box+'<ul>'+children.map(function(c){return hierNode(c,v2);}).join("")+'</ul></li>';}

document.body.addEventListener("click",function(e){
 var t=e.target;if(!t.closest)return;
 if(t.hasAttribute&&t.hasAttribute("data-backdrop")){act("hierclosedetail","");return;}
 var ac0=t.closest("[data-act]");if(ac0){if(ac0.disabled)return;var p0=ac0.getAttribute("data-act").split("|");act(p0[0],p0[1]);return;}
 var nv=t.closest("[data-nav]");if(nv){view=nv.getAttribute("data-nav");tab=0;render();window.scrollTo(0,0);return;}
 var tb=t.closest("[data-tab]");if(tb){tab=parseInt(tb.getAttribute("data-tab"),10);render();window.scrollTo(0,0);return;}
 var oa=t.closest("[data-openart]");if(oa){act("buildfromart",oa.getAttribute("data-openart"));return;}

 var ep=t.closest("[data-editp]");if(ep){var id=ep.getAttribute("data-editp");
  navSec=(navSec==="editp-"+id?null:"editp-"+id);render();return;}
 var ta=t.closest("[data-tapp]");if(ta){navApp=ta.getAttribute("data-tapp");
  var a0=DATA.filter(function(x){return x.id===navApp;})[0];
  navRpt=a0.reports[0].id;navPg=a0.reports[0].pages[0].id;navSec=null;render();return;}
 var tr=t.closest("[data-trpt]");if(tr){navRpt=tr.getAttribute("data-trpt");
  DATA.forEach(function(x){x.reports.forEach(function(r){if(r.id===navRpt)navPg=r.pages[0].id;});});
  navSec=null;render();return;}
 var tp=t.closest("[data-tpg]");if(tp){navPg=tp.getAttribute("data-tpg");navSec=null;render();return;}
 var to=t.closest("[data-torg]");if(to){navOrg=to.getAttribute("data-torg");navSec=null;render();return;}
 var sc=t.closest("[data-sec]");if(sc){var v=sc.getAttribute("data-sec");navSec=(navSec===v?null:v);render();return;}
 var cd=t.closest("[data-cmtd]");if(cd){var q=cd.getAttribute("data-cmtd").split(":");
  cmtDraft[q[0]]=cmtDraft[q[0]]||{};cmtDraft[q[0]].diag=q[1];render();return;}
});

function onField(e){
 var el=e.target;
 if(el.hasAttribute&&el.hasAttribute("data-pv")){var p=para(el.getAttribute("data-pv"));if(p)p.v=el.value;return;}
 if(el.hasAttribute&&el.hasAttribute("data-cmt")){var q=el.getAttribute("data-cmt").split(":");
  cmtDraft[q[0]]=cmtDraft[q[0]]||{};cmtDraft[q[0]][q[1]]=el.value;return;}
 if(el.hasAttribute&&el.hasAttribute("data-decf")){decDraft[el.getAttribute("data-decf")]=el.value;return;}
 if(el.hasAttribute&&el.hasAttribute("data-escf")){escDraft[el.getAttribute("data-escf")]=el.value;return;}
 if(el.hasAttribute&&el.hasAttribute("data-sf")){var sfk=el.getAttribute("data-sf");ensureBuild();
  BUILD.stratForm=BUILD.stratForm||{};BUILD.stratForm[sfk]=el.value;return;}
 if(el.hasAttribute&&el.hasAttribute("data-tpf")){var tq=el.getAttribute("data-tpf").split(":"),t9=tpl(tq[1]);if(!t9)return;
  if(tq[0]==="n"){t9.n=el.value;return;}
  if(tq[0]==="desc"){t9.desc=el.value;return;}
  if(tq[0]==="sech"){t9.sections[+tq[2]].h=el.value;return;}
  return;}
 if(el.hasAttribute&&el.hasAttribute("data-bf")){var bk=el.getAttribute("data-bf");
  if(bk.indexOf("tplpk:")===0){var pkk2=bk.split(":")[1];TPLPICK[pkk2]=el.value;if(pkk2==="kpiId")TPLPICK.dim="";render();return;}
  if(bk.indexOf("hier:")===0){var hk=bk.split(":")[1];HIERFILTER[hk]=el.value;render();return;}
  if(bk.indexOf("bif:")===0){var bfk=bk.split(":")[1];BIFILTER[bfk]=el.value;if(bfk==="dept")BIFILTER.fn="";BIFILTER.openKpi=null;render();return;}
  if(bk.indexOf("dashpick:")===0){var pgid=bk.split(":")[1];DASHPICK[pgid]=el.value;navSec=null;render();return;}
  var B=ensureBuild();
  if(bk==="title"){B.title=el.value;return;}
  if(bk==="to"){B.to=el.value;return;}
  if(bk==="shareWith"){B.shareWith=el.value;return;}
  if(bk==="template"){B.template=el.value;
   var t0=tpl(el.value);
   if(t0&&B.blocks.length===0){var res0=scaffoldFromTemplate(B,t0);
    render();toast("Inserted "+res0.nsec+" section"+(res0.nsec===1?"":"s")+" from "+t0.n+" automatically.");return;}
   render();return;}
  if(bk.indexOf("scope:")===0){var sk=bk.split(":")[1];
   B.scope[sk]=(sk==="month"||sk==="year")?(+el.value):el.value;
   if(sk==="dept")B.scope.fn="";render();return;}
  if(bk.indexOf("pk:")===0){var pkk=bk.split(":")[1];B.pickerSel=B.pickerSel||{};B.pickerSel[pkk]=el.value;render();return;}
  var q6=bk.split(":");var b=B.blocks.filter(function(x){return x.id===q6[1];})[0];if(!b)return;
  if(q6[0]==="h"){b.h=el.value;return;}
  if(q6[0]==="v"){b.v=el.value;return;}
  if(q6[0]==="proc"){b.proc=el.value;render();return;}
  return;}}
document.body.addEventListener("input",onField);
document.body.addEventListener("change",onField);
render();
})();
</script>
